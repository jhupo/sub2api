name: Release Watchdog

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: release-watchdog
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch a missing tag release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          LATEST_TAG=$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" --jq '.[].ref' \
              | sed 's#^refs/tags/##' \
              | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/' \
              | sort -V \
              | tail -n 1
          )

          if [ -z "$LATEST_TAG" ]; then
            echo "No release tag found"
            exit 0
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${LATEST_TAG}" >/dev/null 2>&1; then
            echo "Release ${LATEST_TAG} already exists"
            exit 0
          fi

          ACTIVE_RUNS=$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?per_page=20" \
              --jq '[.workflow_runs[] | select(.status != "completed")] | length'
          )
          if [ "$ACTIVE_RUNS" -ne 0 ]; then
            echo "A release workflow is already active"
            exit 0
          fi

          echo "Dispatching release for ${LATEST_TAG}"
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$DEFAULT_BRANCH" \
            -f tag="$LATEST_TAG" \
            -f simple_release=false
